<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greetings</title>
    <script src="script.js" defer></script>  <!--Defer tells browser to download JS but wait until HTML is fully loaded.-->
</head>
<body>
    <h1>Greeting Generator</h1>
    <div class="occasions"> 
        <div class="form-check">
            <label class="form-check-label">
            <input type="radio" class="form-check-input" name="" id="" value="checkedValue" checked>
            Display value
          </label>
        </div>
    </div>
    <button>Click Here!</button>
    <div id="greeting">Click the button to greet.</div>
</body>
</html>
